name: deploy-viewer

on:
  push:
    branches: [main, master]
    paths:
      - 'viewer/**'
      - 'manifest.json'
      - 'screenshots/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json

      - name: Install viewer deps
        working-directory: viewer
        run: npm ci

      - name: Build viewer
        working-directory: viewer
        run: npm run build
        env:
          # vite.config.ts reads this so asset URLs work under /<repo-name>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Stage screenshots + manifest into dist
        run: |
          mkdir -p viewer/dist/screenshots
          if [ -d screenshots ]; then cp -r screenshots/. viewer/dist/screenshots/; fi
          if [ -f manifest.json ]; then cp manifest.json viewer/dist/manifest.json; fi

      - name: SPA fallback (copy index.html to 404.html)
        # GitHub Pages serves 404.html for any path it can't find. By making it
        # an exact copy of index.html, deep links like /u/some-slug — and F5
        # refreshes on those URLs — boot the React app, which then reads
        # window.location and routes to the right page client-side.
        # Without this, refreshing any non-root URL shows GH's stock 404 page.
        run: cp viewer/dist/index.html viewer/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
